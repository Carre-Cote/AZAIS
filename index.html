<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AYREM — Carré Coté</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#eee;color:#222}
#bar{height:58px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:8px;padding:8px 12px;z-index:5}#bar strong{white-space:nowrap}#s{max-width:280px;padding:7px;border:1px solid #ccc;border-radius:7px;margin-left:auto}
#v{position:fixed;top:58px;left:0;right:0;bottom:0;overflow:hidden;touch-action:none;background:#ddd;cursor:grab}
#l{position:absolute;transform-origin:0 0;will-change:transform}#p{display:block;max-width:none;width:auto;height:auto;user-select:none;-webkit-user-drag:none}#h{position:absolute;inset:0}
.d{position:absolute;width:28px;height:28px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 1px 4px #555;cursor:pointer}
.i{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,90vw);max-height:85vh;overflow:auto;background:#fff;padding:30px;border-radius:14px;box-shadow:0 10px 40px #0004;z-index:10}.i.show{display:block}.x{position:absolute;right:10px;top:6px;font-size:28px;cursor:pointer}.i h2{margin-top:0}.i h3{margin-bottom:6px}.i ul{padding-left:22px}.i li{margin:7px 0;line-height:1.4}
.err{padding:30px;font-size:16px;background:#fff;margin:30px;border-radius:12px;box-shadow:0 4px 20px #0002}
@media(max-width:600px){#bar{height:54px}#v{top:54px}#bar strong{font-size:14px;overflow:hidden;text-overflow:ellipsis}#s{max-width:170px}.i{width:88vw;padding:18px}}
</style>
</head>
<body>
<div id="bar"><strong>AYREM</strong><select id="s"></select></div>
<div id="v"><div id="l"><img id="p" alt="Plan"></div><div id="h"></div></div>
<div id="i" class="i"><span class="x" id="x">×</span><div id="c"></div></div>
<script>
const v=document.getElementById("v"),l=document.getElementById("l"),img=document.getElementById("p"),h=document.getElementById("h"),sel=document.getElementById("s"),box=document.getElementById("i"),content=document.getElementById("c");
let P=null,n=0,S=1,X=0,Y=0,W=0,H=0,pinch=null;
function fit(){if(!W||!H)return;S=Math.min(v.clientWidth/W,v.clientHeight/H);X=(v.clientWidth-W*S)/2;Y=(v.clientHeight-H*S)/2;upd()}
function upd(){l.style.transform="translate3d("+X+"px,"+Y+"px,0) scale("+S+")";draw()}
function draw(){h.innerHTML="";let a=P&&P.levels[n];if(!a||!W||!H)return;a.rooms.forEach(r=>{let d=document.createElement("div");d.className="d";d.style.background=r.color||"#6f42c1";d.style.left=(X+W*r.x/100*S)+"px";d.style.top=(Y+H*r.y/100*S)+"px";d.onclick=e=>{e.stopPropagation();content.innerHTML=r.content||"<h2>"+(r.name||"Pièce")+"</h2><p>Aucune information renseignée.</p>";box.className="i show"};h.appendChild(d)})}
function load(){let a=P.levels[n];W=H=0;if(!a||!a.plan){img.removeAttribute("src");h.innerHTML="";return}img.onload=()=>{W=img.naturalWidth;H=img.naturalHeight;fit()};img.onerror=()=>{h.innerHTML="";content.innerHTML="<p>Plan introuvable : "+a.plan+"</p>";box.className="i show"};img.src=a.plan}
function zoomAt(x,y,z){let ix=(x-X)/S,iy=(y-Y)/S;S=Math.max(.05,Math.min(8,z));X=x-ix*S;Y=y-iy*S;upd()}
v.addEventListener("wheel",e=>{e.preventDefault();let r=v.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,S*(e.deltaY<0?1.12:1/1.12))},{passive:false});
const pointers=new Map();let pan=null,gesture=null;
function pt(e){let r=v.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function startGesture(){const a=[...pointers.values()];if(a.length===2){const c={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};const d=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y);gesture={d,s:S,ix:(c.x-X)/S,iy:(c.y-Y)/S};pan=null}else if(a.length===1){pan={x:a[0].x,y:a[0].y,ox:X,oy:Y};gesture=null}}
v.addEventListener("pointerdown",e=>{if(e.target.closest(".d"))return;e.preventDefault();pointers.set(e.pointerId,pt(e));try{v.setPointerCapture(e.pointerId)}catch(_){};startGesture()},{passive:false});
v.addEventListener("pointermove",e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,pt(e));const a=[...pointers.values()];if(a.length===2&&gesture){const c={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};const d=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y);S=Math.max(.05,Math.min(8,gesture.s*d/gesture.d));X=c.x-gesture.ix*S;Y=c.y-gesture.iy*S;upd()}else if(a.length===1&&pan){X=pan.ox+a[0].x-pan.x;Y=pan.oy+a[0].y-pan.y;upd()}},{passive:false});
function endPointer(e){pointers.delete(e.pointerId);try{v.releasePointerCapture(e.pointerId)}catch(_){};if(pointers.size)startGesture();else{pan=null;gesture=null}}
v.addEventListener("pointerup",endPointer);v.addEventListener("pointercancel",endPointer);
document.getElementById("x").onclick=()=>box.className="i";window.onresize=()=>{if(W&&H)fit()};
fetch("projet.json").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(data=>{P=data;if(!P.levels||!P.levels.length)throw new Error("Aucun étage dans projet.json");P.levels.forEach((a,j)=>{let o=document.createElement("option");o.value=j;o.textContent=a.name||("Étage "+(j+1));sel.appendChild(o)});sel.onchange=()=>{n=+sel.value;load()};load()}).catch(err=>{document.body.innerHTML='<div class="err"><h2>Projet introuvable</h2><p>Impossible de charger <b>projet.json</b>.</p><p>'+String(err.message||err)+'</p></div>'});
</script>
</body></html>
